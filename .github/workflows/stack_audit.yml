name: stack-audit

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi ninja-build python3

      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/ci

      - name: Stack/Recursion audit (gate)
        run: cmake --build build/ci --target audit-stack

